name = "token-monitor-hub"
main = "src/index.js"
compatibility_date = "2025-05-01"
# Preserve operator-managed variables across deployments.
keep_vars = true

[[durable_objects.bindings]]
name = "HUB"
class_name = "HubDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HubDO"]

[vars]
STALE_AFTER_MS = "600000"
# Title permission is managed in the Cloudflare dashboard. Missing means false.
# Set TOKEN_MONITOR_SYNC_SESSION_TITLES to "true" there to permit opted-in devices.

# Set the shared secret with:
#   wrangler secret put TOKEN_MONITOR_SECRET
# Required for all private data routes.

TOKEN_MONITOR_APNS_BUNDLE_ID = "com.javis.tokenmonitor.ios"
TOKEN_MONITOR_APNS_ENVIRONMENT = "production"
TOKEN_MONITOR_APNS_MIN_INTERVAL_MS = "15000"

# ActivityKit remote updates are optional. Configure the APNs key with:
#   wrangler secret put TOKEN_MONITOR_APNS_KEY_ID
#   wrangler secret put TOKEN_MONITOR_APNS_TEAM_ID
#   wrangler secret put TOKEN_MONITOR_APNS_PRIVATE_KEY
