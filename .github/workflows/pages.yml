name: Pages

on:
  push:
    branches: ['main']
    paths:
      - 'site/**'
      # Canonical plugin references are rendered by the site build.
      - 'docs/plugins/README.md'
      - 'docs/plugins/author-quickstart.md'
      - 'docs/plugins/author-ui-options.md'
      - 'docs/plugins/distribution-design.md'
      - 'docs/plugins/author-data-settings.md'
      - 'docs/plugins/author-data-resources.md'
      - 'docs/plugins/publishing.md'
      - 'docs/plugins/validation.md'
      # site/scripts/islands.jsx imports this module, so the islands bundle
      # embeds it. Without this path a change here would deploy nothing and the
      # live site would keep rolling with the old animation.
      - 'src/electron/tokenNumberAnimation.js'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      # Canonical plugin references are rendered by the site build.
      - 'docs/plugins/README.md'
      - 'docs/plugins/author-quickstart.md'
      - 'docs/plugins/author-ui-options.md'
      - 'docs/plugins/distribution-design.md'
      - 'docs/plugins/author-data-settings.md'
      - 'docs/plugins/author-data-resources.md'
      - 'docs/plugins/publishing.md'
      - 'docs/plugins/validation.md'
      # site/scripts/islands.jsx imports this module, so the islands bundle
      # embeds it. Without this path a change here would deploy nothing and the
      # live site would keep rolling with the old animation.
      - 'src/electron/tokenNumberAnimation.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      # Documentation examples execute the production package/catalog validators.
      - name: Install validator dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Install site dependencies
        run: npm ci --prefix site
      - name: Build static site
        run: npm run build --prefix site
      - name: Check generated documentation
        run: npm test --prefix site
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
