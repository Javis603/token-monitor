name: macOS Widget Release Smoke (temporary)

on:
  push:
    branches: [build/macos-widget-release]

concurrency:
  group: macos-widget-release-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            dist_script: dist:mac:widget
            artifact_name: token-monitor-mac-arm64-signed-smoke
          - os: macos-15-intel
            arch: x64
            dist_script: dist:mac:widget:x64
            artifact_name: token-monitor-mac-x64-signed-smoke
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TOKEN_MONITOR_APP_GROUP: ${{ vars.TOKEN_MONITOR_APP_GROUP }}
      TOKEN_MONITOR_WIDGET_BUNDLE_ID: ${{ vars.TOKEN_MONITOR_WIDGET_BUNDLE_ID }}
      TOKEN_MONITOR_WIDGET_KIND: ${{ vars.TOKEN_MONITOR_WIDGET_KIND }}
      TOKEN_MONITOR_MAC_DISTRIBUTION_CHANNEL: developer-id
      DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
      - name: Platform evidence
        run: node -p "process.platform + '-' + process.arch"
      - run: npm ci
      - name: Ensure vendored tokscale (DSH bridge)
        run: node scripts/ensure-vendored-tokscale.js
      - name: Verify vendored tokscale (DSH bridge)
        run: node scripts/verify-vendored-tokscale.js
      - name: Verify signed smoke configuration
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          TOKEN_MONITOR_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.TOKEN_MONITOR_APP_PROVISIONING_PROFILE_BASE64 }}
          TOKEN_MONITOR_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.TOKEN_MONITOR_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in \
            TOKEN_MONITOR_APP_GROUP \
            TOKEN_MONITOR_WIDGET_BUNDLE_ID \
            TOKEN_MONITOR_WIDGET_KIND \
            DEVELOPMENT_TEAM \
            APPLE_API_KEY_BASE64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER \
            CSC_LINK \
            CSC_KEY_PASSWORD \
            TOKEN_MONITOR_APP_PROVISIONING_PROFILE_BASE64 \
            TOKEN_MONITOR_WIDGET_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for the signed macOS Widget smoke build"
              exit 1
            fi
          done
          if [[ "$TOKEN_MONITOR_APP_GROUP" != group.* ]]; then
            echo "::error::The signed macOS Widget smoke build requires a group.* App Group"
            exit 1
          fi
      - name: Prepare macOS Widget provisioning profiles
        shell: bash
        env:
          TOKEN_MONITOR_APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.TOKEN_MONITOR_APP_PROVISIONING_PROFILE_BASE64 }}
          TOKEN_MONITOR_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.TOKEN_MONITOR_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          app_profile="$RUNNER_TEMP/token-monitor-app.provisionprofile"
          widget_profile="$RUNNER_TEMP/token-monitor-widget.provisionprofile"
          printf '%s' "$TOKEN_MONITOR_APP_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$app_profile"
          printf '%s' "$TOKEN_MONITOR_WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$widget_profile"
          chmod 600 "$app_profile" "$widget_profile"
          echo "TOKEN_MONITOR_APP_PROVISIONING_PROFILE=$app_profile" >> "$GITHUB_ENV"
          echo "TOKEN_MONITOR_WIDGET_PROVISIONING_PROFILE=$widget_profile" >> "$GITHUB_ENV"
      - name: Decode Apple API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          chmod 600 "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"
      - name: Build signed macOS Widget artifacts
        run: npm run ${{ matrix.dist_script }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify code signing and notarization
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TOKEN_MONITOR_WIDGET_DISTRIBUTION: '1'
          TOKEN_MONITOR_WIDGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          app_path=$(find dist -maxdepth 2 -name '*.app' -print -quit)
          if [ -z "$app_path" ]; then
            echo "no .app bundle found under dist/" >&2
            exit 1
          fi
          dmg_path=$(find dist -maxdepth 1 -name '*.dmg' -print -quit)
          if [ -z "$dmg_path" ]; then
            echo "no .dmg installer found under dist/" >&2
            exit 1
          fi
          npm run verify:mac:widget-app -- "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl -a -vvv --type execute "$app_path"
          xcrun stapler validate "$app_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
      - name: Upload signed smoke artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap
