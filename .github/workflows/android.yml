name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The runner image already provides ANDROID_HOME, including platforms;android-36.1.
      # setup-android tries to replace those cmdline-tools in the root-owned SDK and fails.
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble
        working-directory: android
        run: ./gradlew :core:test :app:assembleDebug
